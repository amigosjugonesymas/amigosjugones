<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuestas Geek 🗳️ — Amigos Jugones</title>
    <meta name="description"
        content="Vota cada semana por tus juegos de mesa, películas, series, videojuegos y más favoritos de la cultura geek. Gana +1 PTS por cada voto.">
    <meta name="theme-color" content="#080814">

    <!-- Open Graph -->
    <meta property="og:title" content="Encuestas Geek 🗳️ — Amigos Jugones">
    <meta property="og:description"
        content="Votaciones semanales de cultura geek. +1 PTS por votar. Solo para miembros verificados.">
    <meta property="og:type" content="website">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css?v=19.3">
    <link rel="stylesheet" href="css/skins.css?v=1.3">
</head>

<body>

    <!-- ═══ LOADING SCREEN ═══ -->
    <div id="loading-screen">
        <div style="font-size:3rem; animation: doorFloat 3s ease-in-out infinite;">🗳️</div>
        <div class="loading-title">Encuestas Geek</div>
        <div class="spinner"></div>
        <div class="loading-sub">Cargando votaciones...</div>
    </div>

    <!-- ═══ MAINTENANCE SCREEN ═══ -->
    <div id="maintenance-screen" style="display:none;">
        <div style="font-size:4rem; margin-bottom:8px;">🔧</div>
        <div class="loading-title">En Mantenimiento</div>
        <p style="color:var(--text-dim); max-width:400px; text-align:center;">
            Estamos mejorando la plataforma. Vuelve pronto, ¡prepárate para la actualización!
        </p>
        <div class="badge badge-purple" style="margin-top:16px;">⏳ Volvemos pronto</div>
    </div>

    <!-- ═══ APP CONTAINER ═══ -->
    <div id="app-container" class="app-layout" style="display:none;">

        <!-- ── OVERLAY (mobile) ── -->
        <div id="overlay" class="overlay"></div>

        <!-- ── SIDEBAR (Inyectado por components.js) ── -->
        <aside id="sidebar" class="sidebar"></aside>

        <!-- ── TOPBAR (mobile) (Inyectado por components.js) ── -->
        <header id="topbar" class="topbar"></header>

        <!-- ── PAGE CONTENT (No-scroll layout garantizado) ── -->
        <main id="page-content" class="main-content" style="height: 100vh; max-height: 100vh; overflow: hidden; padding: 12px 18px; box-sizing: border-box; display: flex; flex-direction: column;">
            <!-- Renderizado dinámico por main.js -->
        </main>

    </div><!-- /app-container -->

    <!-- ── SCRIPTS ── -->
        <script src="js/i18n.js?v=1.0"></script>
    <script src="js/skin-engine.js?v=1.3"></script>
    <script src="js/analytics.js?v=1.0"></script>
    <script src="js/config.js?v=1.0"></script>
    <script src="js/auth.js?v=2.1"></script>
    <script src="js/components.js?v=12.2"></script>
    <script src="js/main.js?v=24.3"></script>

    <style>
        @keyframes doorFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</body>

</html>
