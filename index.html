<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigos Jugones 🎲 — Tu comunidad de juegos</title>
    <meta name="description"
        content="Amigos Jugones: La comunidad de juegos de mesa más activa. Ranking, mercado de juegos, eventos y más.">
    <meta name="theme-color" content="#080814">
    <link rel="manifest" href="manifest.json">

    <!-- Open Graph -->
    <meta property="og:title" content="Amigos Jugones 🎲">
    <meta property="og:description"
        content="Tu comunidad de juegos de mesa. Rankings, mercado, eventos y la Mansión de los Ecos.">
    <meta property="og:type" content="website">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Chart.js (para gráficos de ranking) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css?v=19.3">
    <link rel="stylesheet" href="css/skins.css?v=1.3">
</head>

<body>

    <!-- ═══ LOADING SCREEN ═══ -->
    <div id="loading-screen">
        <div style="font-size:3rem; animation: doorFloat 3s ease-in-out infinite;">🎲</div>
        <div class="loading-title">Amigos Jugones</div>
        <div class="spinner"></div>
        <div class="loading-sub">Cargando tu comunidad...</div>
    </div>

    <!-- ═══ MAINTENANCE SCREEN ═══ -->
    <div id="maintenance-screen" style="display:none;">
        <div style="font-size:4rem; margin-bottom:8px;">🔧</div>
        <div class="loading-title">En Mantenimiento</div>
        <p style="color:var(--text-dim); max-width:400px; text-align:center;">
            Estamos mejorando la plataforma. Vuelve pronto, esto no tardará. ¡Prepárate para la actualización!
        </p>
        <div class="badge badge-purple" style="margin-top:16px;">⏳ Volvemos pronto</div>
    </div>

    <!-- ═══ APP CONTAINER ═══ -->
    <div id="app-container" class="app-layout" style="display:none;">

        <!-- ── OVERLAY (mobile) ── -->
        <div id="overlay" class="overlay"></div>

        <!-- ── SIDEBAR (Inyectado por components.js) ── -->
        <aside id="sidebar" class="sidebar"></aside>

        <!-- ── TOPBAR (mobile) (Inyectado por components.js) ── -->
        <header id="topbar" class="topbar"></header>

        <!-- ── PAGE CONTENT ── -->
        <!-- La estructura estricta mantiene esta sección fija, permitiendo que su interior haga scroll si es necesario -->
        <main id="page-content" class="main-content" style="height: 100vh; overflow-y: auto;">
            <!-- Renderizado dinámico por main.js según datos.json -->
        </main>

    </div><!-- /app-container -->

    <!-- ── SCRIPTS ── -->
    <script src="js/pwa-register.js"></script>
    <script src="js/i18n.js?v=1.0"></script>
    <script src="js/skin-engine.js?v=1.3"></script>
    <script src="js/analytics.js?v=1.0"></script>
    <script src="js/config.js?v=1.0"></script>
    <script src="js/auth.js?v=2.1"></script>
    <script src="js/components.js?v=12.2"></script>
    <script src="js/popup-diario.js?v=1.0"></script>
    <script src="js/ui-core.js?v=24.4"></script>
    <script src="js/popups.js?v=24.4"></script>
    <script src="js/card-engine.js?v=24.4"></script>
    <script src="js/missions.js?v=24.4"></script>
    <script src="js/rankings.js?v=24.4"></script>
    <script src="js/feed.js?v=24.4"></script>
    <script src="js/renderers.js?v=24.4"></script>
    <script src="js/main.js?v=24.4"></script>

    <style>
        /* Keyframe para el ícono de loading (definido aquí para asegurar disponibilidad antes del CSS) */
        @keyframes doorFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }
    </style>
</body>

</html>
