<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankings de la Comunidad 📊 — Amigos Jugones</title>
    <meta name="description" content="Rankings históricos y estadísticas de la comunidad Amigos Jugones: mensajes sin leer, récords y más.">
    <meta name="theme-color" content="#080814">

    <!-- Open Graph -->
    <meta property="og:title" content="Rankings de la Comunidad 📊 — Amigos Jugones">
    <meta property="og:description" content="Rankings históricos y estadísticas de la comunidad: mensajes sin leer, récords y más.">
    <meta property="og:type" content="website">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css?v=19.3">
    <link rel="stylesheet" href="css/skins.css?v=1.3">
</head>

<body class="page-ranking">

    <!-- ═══ LOADING SCREEN ═══ -->
    <div id="loading-screen">
        <div style="font-size:3rem; animation: rankFloat 3s ease-in-out infinite;">📊</div>
        <div class="loading-title">Rankings Comunidad</div>
        <div class="spinner"></div>
        <div class="loading-sub">Cargando estadísticas históricas...</div>
    </div>

    <!-- ═══ MAINTENANCE SCREEN ═══ -->
    <div id="maintenance-screen" style="display:none;">
        <div style="font-size:4rem; margin-bottom:8px;">🔧</div>
        <div class="loading-title">En Mantenimiento</div>
        <p style="color:var(--text-dim); max-width:400px; text-align:center;">
            Estamos mejorando la plataforma. Vuelve pronto, ¡prepárate para la actualización!
        </p>
        <div class="badge badge-purple" style="margin-top:16px;">⏳ Volvemos pronto</div>
    </div>

    <!-- ═══ APP CONTAINER ═══ -->
    <div id="app-container" class="app-layout" style="display:none;">

        <!-- ── OVERLAY (mobile) ── -->
        <div id="overlay" class="overlay"></div>

        <!-- ── SIDEBAR (Inyectado por components.js) ── -->
        <aside id="sidebar" class="sidebar"></aside>

        <!-- ── TOPBAR (mobile) (Inyectado por components.js) ── -->
        <header id="topbar" class="topbar"></header>

        <!-- ── PAGE CONTENT ── -->
        <main id="page-content" class="main-content" style="height: 100vh; max-height: 100vh; overflow: hidden; display: flex; flex-direction: column; padding: 16px; box-sizing: border-box;">
            <!-- Renderizado dinámico por main.js -->
        </main>

    </div><!-- /app-container -->

    <!-- ── SCRIPTS ── -->
    <script src="js/i18n.js?v=1.0"></script>
    <script src="js/skin-engine.js?v=1.3"></script>
    <script src="js/analytics.js?v=1.0"></script>
    <script src="js/config.js?v=1.0"></script>
    <script src="js/auth.js?v=2.1"></script>
    <script src="js/components.js?v=12.2"></script>
    <script src="js/main.js?v=24.3"></script>

    <style>
        @keyframes rankFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%       { transform: translateY(-8px) rotate(5deg); }
        }
    </style>
</body>

</html>
